<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>さんすうノート</title>
<meta name="description" content="3年生から6年生までの算数を、コツコツ練習できる問題集アプリ">
<meta name="theme-color" content="#F2A65A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="さんすうノート">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --font-round:"Hiragino Maru Gothic ProN","BIZ UDGothic","Yu Gothic Medium","Yu Gothic","Meiryo",sans-serif;
    --font-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    --paper:#EEF3EF;
    --paper-card:#FFFFFF;
    --ink:#233127;
    --ink-soft:#5B6B60;
    --line:#D7E2DA;
    --good:#2E9E5B;
    --good-bg:#E4F6EA;
    --bad:#E2564A;
    --bad-bg:#FBE7E4;
    --g3:#F2A65A;
    --g3-bg:#FCEEDD;
    --g4:#4E9BDE;
    --g4-bg:#E4F1FB;
    --g5:#57B37A;
    --g5-bg:#E4F5EA;
    --g6:#9C7FD1;
    --g6-bg:#EEE7F9;
    --accent: var(--g3);
    --accent-bg: var(--g3-bg);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 26px 26px;
    font-family:var(--font-body);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:18px 12px 60px;
  }
  .app{
    width:100%;
    max-width:480px;
  }
  .cover{
    background:var(--paper-card);
    border-radius:18px;
    padding:18px 20px 16px;
    box-shadow:0 2px 0 rgba(35,49,39,0.08);
    position:relative;
    border:2px solid var(--ink);
    margin-bottom:14px;
  }
  .cover::before{
    content:"";
    position:absolute;
    left:26px; top:0; bottom:0;
    width:2px;
    background:repeating-linear-gradient(var(--bad) 0 6px, transparent 6px 14px);
    opacity:.35;
  }
  .cover h1{
    font-family:var(--font-round);
    font-size:26px;
    margin:0 0 2px 18px;
    letter-spacing:.02em;
  }
  .cover p{
    margin:0 0 0 18px;
    font-size:13px;
    color:var(--ink-soft);
  }

  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:0;
  }
  .tab{
    flex:1;
    border:2px solid var(--ink);
    border-bottom:none;
    border-radius:12px 12px 0 0;
    background:#dfe6e1;
    padding:10px 4px 8px;
    text-align:center;
    font-family:var(--font-round);
    font-size:15px;
    cursor:pointer;
    color:var(--ink-soft);
    position:relative;
    top:2px;
    transition:transform .12s ease;
  }
  .tab.active{
    background:var(--accent-bg);
    color:var(--ink);
    top:0;
    box-shadow:0 -2px 0 var(--accent) inset;
  }
  .tab .num{ font-size:20px; display:block; font-weight:700;}
  .tab:active{ transform:translateY(1px); }

  .panel{
    background:var(--paper-card);
    border:2px solid var(--ink);
    border-radius:0 0 16px 16px;
    padding:16px 16px 18px;
  }

  .topics{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:6px;
  }
  .chip{
    border:2px solid var(--ink);
    background:#fff;
    border-radius:999px;
    padding:6px 13px;
    font-size:13px;
    cursor:pointer;
    color:var(--ink);
  }
  .chip.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }

  .record{
    font-size:12px;
    color:var(--ink-soft);
    margin:8px 2px 14px;
    min-height:16px;
  }

  .quiz-card{
    background:#fff;
    border:2px solid var(--ink);
    border-radius:14px;
    padding:20px 16px 18px;
    position:relative;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 27px;
  }
  .quiz-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .streak{
    font-family:var(--font-round);
    color:var(--accent);
    font-weight:700;
  }
  .question{
    font-family:var(--font-round);
    font-size:21px;
    line-height:1.6;
    text-align:center;
    margin:6px 0 16px;
    word-break:keep-all;
  }
  .diagram{ display:flex; justify-content:center; margin:4px 0 14px; }
  .hissan{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    font-family:var(--font-round);
    font-size:24px;
    width:fit-content;
    margin:0 auto 16px;
    padding:0 6px;
  }
  .hissan .row{ display:flex; }
  .hissan .op{ width:26px; text-align:left; }
  .hissan .val{ letter-spacing:2px; }
  .hissan hr{
    width:100%;
    border:none;
    border-top:3px solid var(--ink);
    margin:2px 0 6px;
  }

  .scratch-wrap{
    border:2px dashed var(--line);
    border-radius:12px;
    padding:8px 10px 10px;
    margin:0 0 14px;
    background:#FCFCF9;
  }
  .scratch-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  .scratch-label{ font-size:12px; color:var(--ink-soft); }
  .scratch-clear{
    font-family:var(--font-body);
    font-size:12px;
    border:1px solid var(--ink-soft);
    background:#fff;
    color:var(--ink-soft);
    border-radius:999px;
    padding:3px 12px;
    cursor:pointer;
  }
  .scratch-clear:active{ transform:translateY(1px); }
  .scratch-pad{
    display:block;
    width:100%;
    height:min(58vh, 460px);
    min-height:260px;
    border-radius:8px;
    border:1px solid var(--line);
    background:
      linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 22px;
    background-color:#fff;
    touch-action:none;
    cursor:crosshair;
  }

  .answer-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:14px;
  }
  .choice-btn{
    font-family:var(--font-round);
    font-size:17px;
    padding:12px 8px;
    border:2px solid var(--ink);
    border-radius:12px;
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    word-break:break-word;
  }
  .choice-btn:active{ transform:translateY(1px); }
  .choice-btn.selected{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .frac{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    vertical-align:middle;
    line-height:1.15;
    margin:0 3px;
  }
  .frac-num{ padding:0 3px 2px; border-bottom:2px solid currentColor; }
  .frac-den{ padding:2px 3px 0; }
  .frac-op{ margin:0 6px; }

  .feedback{
    min-height:44px;
    border-radius:10px;
    text-align:center;
    font-size:14px;
    padding:8px 10px;
    margin-bottom:12px;
    display:none;
  }
  .feedback.show{ display:block; }
  .feedback.good{ background:var(--good-bg); color:var(--good); }
  .feedback.bad{ background:var(--bad-bg); color:var(--bad); }
  .feedback b{ font-family:var(--font-round); font-size:15px; }

  .actions{ display:flex; justify-content:center; }
  .btn{
    font-family:var(--font-round);
    font-size:16px;
    padding:11px 30px;
    border-radius:999px;
    border:2px solid var(--ink);
    background:var(--accent);
    color:#fff;
    cursor:pointer;
  }
  .btn:active{ transform:translateY(1px); }
  .btn.secondary{ background:#fff; color:var(--ink); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn:disabled:active{ transform:none; }

  .footnote{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:14px;
  }
  svg text{ font-family:var(--font-round); }

  .hidden{ display:none !important; }
  .set-result{
    text-align:center;
    padding:30px 10px 10px;
  }
  .set-result-emoji{ font-size:52px; line-height:1; margin-bottom:10px; }
  .set-result-title{
    font-family:var(--font-round);
    font-size:22px;
    margin-bottom:8px;
  }
  .set-result-score{
    font-size:15px;
    color:var(--ink-soft);
    margin-bottom:20px;
  }

  .user-bar-wrap{
    background:var(--paper-card);
    border:2px solid var(--ink);
    border-radius:14px;
    padding:10px 14px;
    margin-bottom:14px;
  }
  .user-bar-label{ font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
  .user-bar{ display:flex; flex-wrap:wrap; gap:7px; }
  .user-chip{
    display:flex; align-items:center; gap:6px;
    border:2px solid var(--ink);
    background:#fff;
    border-radius:999px;
    padding:6px 8px 6px 14px;
    font-size:13px;
    cursor:pointer;
  }
  .user-chip.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .user-chip-del{
    font-size:11px;
    color:var(--ink-soft);
    width:18px; height:18px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.06);
    flex:none;
  }
  .user-chip.active .user-chip-del{ color:#fff; background:rgba(255,255,255,0.25); }
  .user-chip-add{ padding:6px 14px; color:var(--ink-soft); border-style:dashed; }

  .cat-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:0 0 10px;
    font-size:12px;
    color:var(--ink-soft);
    gap:8px;
  }
  .cat-book-btn{
    font-family:var(--font-round);
    font-size:13px;
    border:2px solid var(--ink);
    background:#fff;
    border-radius:999px;
    padding:5px 12px;
    cursor:pointer;
    white-space:nowrap;
  }
  .cat-book-btn:active{ transform:translateY(1px); }

  .cat-overlay{
    position:fixed; inset:0;
    background:rgba(35,49,39,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:18px;
    z-index:50;
  }
  .cat-modal{
    background:#fff;
    border:2px solid var(--ink);
    border-radius:18px;
    padding:18px;
    width:100%;
    max-width:420px;
    max-height:82vh;
    overflow-y:auto;
  }
  .cat-modal-top{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:6px;
  }
  .cat-modal-top h2{ font-family:var(--font-round); font-size:19px; margin:0; }
  .cat-close{
    border:none; background:none; font-size:22px; line-height:1; color:var(--ink-soft); cursor:pointer;
  }
  .cat-progress{ font-size:12px; color:var(--ink-soft); margin-bottom:12px; }
  .cat-tier-label{ font-family:var(--font-round); font-size:13px; margin:12px 0 6px; }
  .cat-tier{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
  .cat-slot{
    width:58px; height:100px;
    border-radius:10px;
    background:#F4F4F0;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    flex:none;
    border:1px solid var(--line);
  }
  .cat-slot img{ width:100%; height:100%; object-fit:cover; display:block; }
  .cat-slot.cat-bonus{ width:72px; height:124px; background:linear-gradient(135deg,#FDE7FF,#CDEBFF,#FFF6C9); border-color:#C9A9E0; }
  .cat-slot.cat-locked{ background:#E7ECE8; }
  .cat-mystery{ font-family:var(--font-round); font-size:22px; color:var(--ink-soft); opacity:.5; }

  .cat-toast{
    position:fixed;
    left:50%; bottom:24px;
    transform:translate(-50%, 20px);
    display:flex; align-items:center; gap:10px;
    background:#fff;
    border:2px solid var(--ink);
    border-radius:14px;
    padding:10px 16px;
    box-shadow:0 6px 16px rgba(0,0,0,0.18);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:60;
    max-width:90vw;
  }
  .cat-toast.show{ opacity:1; transform:translate(-50%, 0); }
  .cat-toast-icon{ width:46px; height:78px; flex:none; border-radius:8px; overflow:hidden; }
  .cat-toast-icon img{ width:100%; height:100%; object-fit:cover; display:block; }
  .cat-toast-text{ font-family:var(--font-round); font-size:13px; line-height:1.4; }
</style>
</head>
<body>
<div class="app">

  <div class="cover">
    <h1>さんすうノート</h1>
    <p>3年生から6年生までの算数を、コツコツ練習しよう</p>
  </div>

  <div class="user-bar-wrap">
    <div class="user-bar-label">だれがやる？</div>
    <div class="user-bar" id="userBar"></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="panel">
    <div class="topics" id="topics"></div>
    <div class="record" id="record"></div>
    <div class="cat-bar">
      <span id="catPointsText">🐱 つぎのねこまで あと100点</span>
      <button type="button" id="catBookBtn" class="cat-book-btn">ねこずかん</button>
    </div>

    <div class="quiz-card">
      <div class="quiz-top">
        <span id="progressText">セット1・1/10問</span>
        <span class="streak" id="streakText">🔥 0連続</span>
      </div>
      <div id="quizPlay">
        <div class="diagram" id="diagram"></div>
        <div class="question" id="question"></div>
        <div class="scratch-wrap">
          <div class="scratch-top">
            <span class="scratch-label">✏️ けいさんメモ（フリーハンド）</span>
            <button type="button" id="scratchClearBtn" class="scratch-clear">けす</button>
          </div>
          <canvas id="scratchPad" class="scratch-pad"></canvas>
        </div>
        <div class="answer-row" id="answerRow"></div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn" id="mainBtn">こたえあわせ</button>
        </div>
      </div>
      <div class="set-result hidden" id="setResult">
        <div class="set-result-emoji" id="setResultEmoji">🎉</div>
        <div class="set-result-title" id="setResultTitle">セット1 クリア！</div>
        <div class="set-result-score" id="setResultScore">10問中 0問正解（0点）</div>
        <div class="actions">
          <button class="btn" id="nextSetBtn">つぎのセットへ</button>
        </div>
      </div>
    </div>
    <div class="footnote">わからない時は、おうちの人と一緒に考えてみよう</div>
  </div>
</div>

<div class="cat-overlay hidden" id="catOverlay">
  <div class="cat-modal">
    <div class="cat-modal-top">
      <h2>🐱 ねこずかん</h2>
      <button type="button" id="catCloseBtn" class="cat-close">×</button>
    </div>
    <div class="cat-progress" id="catProgressText"></div>
    <div class="cat-tier-label">ふつうのねこ</div>
    <div class="cat-tier" id="catTierNormal"></div>
    <div class="cat-tier-label">シルバーのねこ（ふつうを5匹集めると進化）</div>
    <div class="cat-tier" id="catTierSilver"></div>
    <div class="cat-tier-label">ゴールドのねこ（シルバーを5匹集めると進化）</div>
    <div class="cat-tier" id="catTierGold"></div>
    <div class="cat-tier-label">🌈 でんせつのねこ（ゴールドを5匹集めるとゲット）</div>
    <div class="cat-tier" id="catTierBonus"></div>
  </div>
</div>
<div class="cat-toast" id="catToast"></div>

<script>
/* ---------- utilities ---------- */
function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[rand(0,arr.length-1)]; }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; }
function lcm(a,b){ return Math.abs(a*b)/gcd(a,b); }
function simplifyFrac(n,d){ if(d<0){ n=-n; d=-d; } const g=gcd(n,d)||1; return [n/g, d/g]; }
function factorial(n){ let r=1; for(let i=2;i<=n;i++) r*=i; return r; }
function nCk(n,k){ return factorial(n)/(factorial(k)*factorial(n-k)); }
function fracSpanHTML(n,d){
  return `<span class="frac"><span class="frac-num">${n}</span><span class="frac-den">${d}</span></span>`;
}
function fracHTMLRaw(n,d){
  return d===1 ? String(n) : fracSpanHTML(n,d);
}
function fracHTML(n,d){
  const [sn,sd]=simplifyFrac(n,d);
  return sd===1 ? String(sn) : fracSpanHTML(sn,sd);
}
function pad2(x){ return String(x).padStart(2,'0'); }
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=rand(0,i); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ---------- 4択のダミー選択肢(distractor)生成 ---------- */
function genFractionDistractors(correct){
  const keyOf=(n,d)=>{ const [sn,sd]=simplifyFrac(n,d); return sn+'/'+sd; };
  const seen=new Set([keyOf(correct.n, correct.d)]);
  const out=[];
  const tryAdd=(n,d)=>{
    if(d===0) return;
    const k=keyOf(n,d);
    if(seen.has(k)) return;
    seen.add(k); out.push({n,d});
  };
  const candidates=[
    [correct.n+1, correct.d],
    [Math.max(1,correct.n-1), correct.d],
    [correct.n, correct.d+1],
    [correct.n, Math.max(1,correct.d-1)],
    [correct.d, correct.n],
    [correct.n+2, correct.d],
    [correct.n, correct.d+2],
  ];
  for(const [n,d] of candidates){ if(out.length>=3) break; tryAdd(n,d); }
  let bump=3;
  while(out.length<3){ tryAdd(correct.n+bump, correct.d); if(out.length<3) tryAdd(correct.n, correct.d+bump); bump++; }
  return out.slice(0,3);
}
function genRatioDistractors(correct){
  const keyOf=(a,b)=>{ const [sa,sb]=simplifyFrac(a,b); return sa+':'+sb; };
  const seen=new Set([keyOf(correct.a, correct.b)]);
  const out=[];
  const tryAdd=(a,b)=>{
    if(a<=0||b<=0) return;
    const k=keyOf(a,b);
    if(seen.has(k)) return;
    seen.add(k); out.push({a,b});
  };
  const candidates=[
    [correct.b, correct.a],
    [correct.a+1, correct.b],
    [correct.a, correct.b+1],
    [Math.max(1,correct.a-1), correct.b],
    [correct.a, Math.max(1,correct.b-1)],
    [correct.a+1, correct.b+1],
  ];
  for(const [a,b] of candidates){ if(out.length>=3) break; tryAdd(a,b); }
  let bump=2;
  while(out.length<3){ tryAdd(correct.a+bump, correct.b); if(out.length<3) tryAdd(correct.a, correct.b+bump); bump++; }
  return out.slice(0,3);
}
function genTimeDistractors(correct){
  const keyOf=(h,m)=>pad2(((h%24)+24)%24)+':'+pad2(m);
  const seen=new Set([keyOf(correct.h, correct.m)]);
  const out=[];
  const tryAdd=(h,m)=>{
    h=((h%24)+24)%24; m=((m%60)+60)%60;
    const k=keyOf(h,m);
    if(seen.has(k)) return;
    seen.add(k); out.push({h,m});
  };
  const deltas=[5,-5,10,-10,15,-15,30,-30];
  for(const d of deltas){
    if(out.length>=3) break;
    const total=correct.h*60+correct.m+d;
    tryAdd(Math.floor(total/60), ((total%60)+60)%60);
  }
  let bump=1;
  while(out.length<3){ tryAdd(correct.h+bump, correct.m); bump++; }
  return out.slice(0,3);
}
function genPairDistractors(correctValues){
  const [cq, cr]=correctValues;
  const keyOf=(q,r)=>q+'|'+r;
  const seen=new Set([keyOf(cq,cr)]);
  const out=[];
  const tryAdd=(q,r)=>{
    if(q<0||r<0) return;
    const k=keyOf(q,r);
    if(seen.has(k)) return;
    seen.add(k); out.push([q,r]);
  };
  const candidates=[
    [cr, cq],
    [cq+1, cr],
    [Math.max(0,cq-1), cr],
    [cq, cr+1],
    [cq, Math.max(0,cr-1)],
    [cq+1, Math.max(0,cr-1)],
  ];
  for(const [q,r] of candidates){ if(out.length>=3) break; tryAdd(q,r); }
  let bump=2;
  while(out.length<3){ tryAdd(cq+bump, cr); bump++; }
  return out.slice(0,3);
}
function genSingleDistractors(correct, opts){
  opts = opts || {};
  const isDecimal = !!opts.decimal;
  const min = (opts.range && opts.range.min!==undefined) ? opts.range.min : 0;
  const max = (opts.range && opts.range.max!==undefined) ? opts.range.max : Infinity;
  const roundVal = isDecimal ? (x)=>Math.round(x*100)/100 : (x)=>Math.round(x);
  const seen = new Set([roundVal(correct)]);
  const out=[];
  const tryAdd=(x)=>{
    x=roundVal(x);
    if(x<min || x>max) return;
    if(seen.has(x)) return;
    seen.add(x); out.push(x);
  };
  const step = opts.step || (isDecimal
    ? Math.max(0.1, Math.round(Math.abs(correct)*0.1*10)/10)
    : Math.max(1, Math.round(Math.abs(correct)*0.05)));
  const smallSteps = isDecimal ? [0.1,-0.1,0.2,-0.2] : [1,-1,2,-2,3,-3];
  const candidates=[...smallSteps, step, -step, step*2, -step*2];
  for(const d of candidates){ if(out.length>=3) break; tryAdd(correct+d); }
  let bump = isDecimal ? 0.1 : Math.max(1, step);
  while(out.length<3){ tryAdd(correct+bump); bump += isDecimal ? 0.1 : step; }
  return out.slice(0,3);
}

function correctValueSet(problem){
  if(problem.answerFormat==='fraction') return {n:problem.answers[0].n, d:problem.answers[0].d};
  if(problem.answerFormat==='ratio') return {a:problem.answers[0].a, b:problem.answers[0].b};
  if(problem.answerFormat==='time') return {h:problem.answers[0].h, m:problem.answers[0].m};
  if(problem.multiAnswer) return {values:problem.answers.map(a=>a.value)};
  return problem.answers[0].value;
}
function getDistractorValueSets(problem){
  if(problem.answerFormat==='fraction') return genFractionDistractors(correctValueSet(problem));
  if(problem.answerFormat==='ratio') return genRatioDistractors(correctValueSet(problem));
  if(problem.answerFormat==='time') return genTimeDistractors(correctValueSet(problem));
  if(problem.multiAnswer) return genPairDistractors(correctValueSet(problem).values).map(values=>({values}));
  const a=problem.answers[0];
  return genSingleDistractors(a.value, {decimal:a.type==='decimal', step:problem.distractorStep, range:problem.distractorRange});
}
function formatChoiceFromValueSet(problem, valueSet){
  if(problem.answerFormat==='fraction') return fracHTML(valueSet.n, valueSet.d);
  if(problem.answerFormat==='ratio') return valueSet.a+':'+valueSet.b;
  if(problem.answerFormat==='time') return pad2(valueSet.h)+'時'+pad2(valueSet.m)+'分';
  if(problem.multiAnswer){
    return problem.answers.map((a,i)=>(a.label? a.label+' ':'')+valueSet.values[i]+(a.unit||'')).join('　');
  }
  const a=problem.answers[0];
  return (a.label? a.label+' ':'')+valueSet+(a.unit||'');
}

/* ---------- svg diagram helpers ---------- */
function svgWrap(inner, w=260, h=170){
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${inner}</svg>`;
}
function angleDiagram(theta1){
  const cx=130, cy=140, r1=95, r2=60;
  const phi = 180-theta1; // slant ray angle from +x axis (ccw, screen up)
  const rad = phi*Math.PI/180;
  const sx = cx + r1*Math.cos(rad);
  const sy = cy - r1*Math.sin(rad);
  const leftLabelX = cx-70, leftLabelY = cy-14;
  const rightLabelX = cx+50, rightLabelY = cy-14;
  return svgWrap(`
    <line x1="${cx-105}" y1="${cy}" x2="${cx+105}" y2="${cy}" stroke="#233127" stroke-width="3"/>
    <line x1="${cx}" y1="${cy}" x2="${sx}" y2="${sy}" stroke="#233127" stroke-width="3"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="#233127"/>
    <text x="${leftLabelX}" y="${leftLabelY}" font-size="16" fill="#F2A65A" text-anchor="middle">${theta1}°</text>
    <text x="${rightLabelX}" y="${rightLabelY}" font-size="16" fill="#E2564A" text-anchor="middle">？</text>
  `,260,160);
}
function triangleDiagram(base, height){
  const bx=40, by=130, bw=190;
  const apexX = bx+bw*0.4;
  return svgWrap(`
    <polygon points="${bx},${by} ${bx+bw},${by} ${apexX},${by-100}" fill="#E4F5EA" stroke="#233127" stroke-width="3"/>
    <line x1="${apexX}" y1="${by-100}" x2="${apexX}" y2="${by}" stroke="#57B37A" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="${(bx+bx+bw)/2}" y="${by+20}" font-size="15" text-anchor="middle">底辺 ${base}cm</text>
    <text x="${apexX+10}" y="${by-45}" font-size="15" fill="#57B37A">高さ ${height}cm</text>
  `,260,175);
}
function parallelogramDiagram(base, height){
  const bx=40, by=130, bw=170, shift=45;
  return svgWrap(`
    <polygon points="${bx},${by} ${bx+bw},${by} ${bx+bw-shift},${by-90} ${bx-shift},${by-90}" fill="#E4F5EA" stroke="#233127" stroke-width="3"/>
    <line x1="${bx+30}" y1="${by-90}" x2="${bx+30}" y2="${by}" stroke="#57B37A" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="${(bx+bx+bw)/2}" y="${by+20}" font-size="15" text-anchor="middle">底辺 ${base}cm</text>
    <text x="${bx+40}" y="${by-45}" font-size="15" fill="#57B37A">高さ ${height}cm</text>
  `,260,175);
}
function circleDiagram(r){
  const cx=130, cy=90, R=Math.min(70, 34+r*2);
  return svgWrap(`
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="#EEE7F9" stroke="#233127" stroke-width="3"/>

/* ---------- ユーザー(だれがやるか)ごとの記録 ---------- */
const PROFILES_KEY='sansu-profiles-v2';
const OLD_PROGRESS_KEY='sansu-progress-v1';
let profilesState = { users:[], currentUser:null, data:{} };

function todayStr(){ return new Date().toISOString().slice(0,10); }
function makeEmptyProfile(){
  return { totalPoints:0, streak:0, todayDate:todayStr(), todayAttempted:0, todayCorrect:0, progress:{} };
}
function loadProfiles(){
  try{
    const raw = window.localStorage.getItem(PROFILES_KEY);
    if(raw){ profilesState = JSON.parse(raw); return; }
  }catch(e){}
  try{
    const oldRaw = window.localStorage.getItem(OLD_PROGRESS_KEY);
    if(oldRaw){
      const migrated = makeEmptyProfile();
      migrated.progress = JSON.parse(oldRaw) || {};
      profilesState = { users:['みんな'], currentUser:'みんな', data:{ 'みんな': migrated } };
      return;
    }
  }catch(e){}
  profilesState = { users:[], currentUser:null, data:{} };
}
function saveProfiles(){
  try{ window.localStorage.setItem(PROFILES_KEY, JSON.stringify(profilesState)); }catch(e){}
}
function ensureTodayReset(profile){
  const t=todayStr();
  if(profile.todayDate!==t){ profile.todayDate=t; profile.todayAttempted=0; profile.todayCorrect=0; }
}
function getCurrentProfile(){
  const profile = profilesState.data[profilesState.currentUser];
  ensureTodayReset(profile);
  return profile;
}
function promptNewUserName(){
  const name = window.prompt('なまえを にゅうりょくしてね（例：たろう）');
  if(!name) return null;
  return name.trim().slice(0,12) || null;
}
function addUser(name){
  if(!profilesState.users.includes(name)){
    profilesState.users.push(name);
    profilesState.data[name] = makeEmptyProfile();
  }
  profilesState.currentUser = name;
  saveProfiles();
}
function deleteUser(name){
  profilesState.users = profilesState.users.filter(u=>u!==name);
  delete profilesState.data[name];
  if(profilesState.currentUser===name){
    profilesState.currentUser = profilesState.users[0] || null;
  }
  saveProfiles();
}
function recordKey(grade, topicId){ return grade+'_'+topicId; }
function recordResult(grade, topicId, correct){
  const profile=getCurrentProfile();
  const k=recordKey(grade,topicId);
  if(!profile.progress[k]) profile.progress[k]={attempted:0, correct:0};
  profile.progress[k].attempted++;
  if(correct) profile.progress[k].correct++;
  saveProfiles();
}

  document.getElementById('catProgressText').textContent =
    `つぎのねこまで あと${POINTS_PER_CAT-st.pointsInCycle}点　|　ふつう${st.normalCount}匹　シルバー${st.silverCount}匹　ゴールド${st.goldCount}匹`;
  renderCatTierRow(document.getElementById('catTierNormal'), st.normalCount, 'normal');
  renderCatTierRow(document.getElementById('catTierSilver'), st.silverCount, 'silver');
  renderCatTierRow(document.getElementById('catTierGold'), st.goldCount, 'gold');
  renderCatBonusSlot(document.getElementById('catTierBonus'), st.rainbowCount);
}
let catToastTimer=null;
function showCatToast(html, label){
  const el=document.getElementById('catToast');
  el.innerHTML = `<div class="cat-toast-icon">${html}</div><div class="cat-toast-text">${label}</div>`;
  el.classList.add('show');
  clearTimeout(catToastTimer);
  catToastTimer=setTimeout(()=>{ el.classList.remove('show'); }, 3200);
}
function checkCatMilestones(beforePoints, afterPoints){
  const before=computeCatState(beforePoints), after=computeCatState(afterPoints);
  if(after.rainbowCount>before.rainbowCount){
    showCatToast(`<img src="${CAT_BONUS.img}" alt="${CAT_BONUS.name}">`, `🌈 でんせつのねこを<br>ゲット！「${CAT_BONUS.name}」`);
  }else if(after.goldCount>before.goldCount){
    const sp=CAT_SPECIES[(after.goldCount-1)%5];
    showCatToast(catImgTag(sp,'gold'), `✨ ゴールドねこを<br>ゲット！「${sp.name}」`);
  }else if(after.silverCount>before.silverCount){
    const sp=CAT_SPECIES[(after.silverCount-1)%5];
    showCatToast(catImgTag(sp,'silver'), `🥈 シルバーねこを<br>ゲット！「${sp.name}」`);
  }else if(after.normalCount>before.normalCount){
    const sp=CAT_SPECIES[(after.normalCount-1)%5];
    showCatToast(catImgTag(sp,'normal'), `🐱 ねこを<br>ゲット！「${sp.name}」`);
  }
}

/* ---------- rendering ---------- */
const tabsEl=document.getElementById('tabs');
const topicsEl=document.getElementById('topics');
const recordEl=document.getElementById('record');
const diagramEl=document.getElementById('diagram');
const questionEl=document.getElementById('question');
const answerRowEl=document.getElementById('answerRow');
const feedbackEl=document.getElementById('feedback');
const mainBtn=document.getElementById('mainBtn');
const progressTextEl=document.getElementById('progressText');
const streakTextEl=document.getElementById('streakText');

function setAccent(grade){
  const g=GRADES.find(x=>x.id===grade);
  document.documentElement.style.setProperty('--accent', getComputedStyle(document.documentElement).getPropertyValue(g.color));
  document.documentElement.style.setProperty('--accent-bg', getComputedStyle(document.documentElement).getPropertyValue(g.bg));
}

function renderTabs(){
  tabsEl.innerHTML='';
  GRADES.forEach(g=>{
    const el=document.createElement('div');
    el.className='tab'+(g.id===state.grade?' active':'');
    el.innerHTML=`<span class="num">${g.id}</span>年生`;
    el.onclick=()=>{
      state.grade=g.id; state.topicIdx=0;
      setAccent(state.grade);
      renderTabs(); renderTopics(); state.setIndex=1; startNewSet();
    };
    tabsEl.appendChild(el);
  });
}

function renderTopics(){
  topicsEl.innerHTML='';
  TOPICS[state.grade].forEach((t,idx)=>{
    const el=document.createElement('div');
    el.className='chip'+(idx===state.topicIdx?' active':'');
    el.textContent=t.name;
    el.onclick=()=>{ state.topicIdx=idx; state.setIndex=1; renderTopics(); startNewSet(); };
    topicsEl.appendChild(el);
  });
  renderRecord();
}

function renderRecord(){
  const t=TOPICS[state.grade][state.topicIdx];
  const k=recordKey(state.grade, t.id);
  const rec=getCurrentProfile().progress[k];
  const profile=getCurrentProfile();
  const todayText=`きょう: ${profile.todayAttempted}問 / 正解 ${profile.todayCorrect}問`;
  if(rec && rec.attempted>0){
    const pct=Math.round(rec.correct/rec.attempted*100);
    recordEl.textContent=`これまでの記録：${rec.attempted}問中${rec.correct}問正解（${pct}%）　|　${todayText}`;
  }else{
    recordEl.textContent=`はじめての問題です。がんばろう！　|　${todayText}`;
  }
}

function renderUserBar(){
  const bar=document.getElementById('userBar');
  bar.innerHTML='';
  profilesState.users.forEach(name=>{
    const chip=document.createElement('div');
    chip.className='user-chip'+(name===profilesState.currentUser? ' active':'');
    const label=document.createElement('span');
    label.textContent=name;
    chip.appendChild(label);
    const del=document.createElement('span');
    del.className='user-chip-del';
    del.textContent='×';
    del.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(window.confirm(`「${name}」のきろくを削除しますか？`)){
        deleteUser(name);
        if(!profilesState.currentUser){
          addUser('プレイヤー1');
        }
        onUserChanged();
      }
    });
    chip.appendChild(del);
    chip.addEventListener('click', ()=>{
      if(profilesState.currentUser!==name){
        profilesState.currentUser=name;
        saveProfiles();
        onUserChanged();
      }
    });
    bar.appendChild(chip);
  });
  const addBtn=document.createElement('div');
  addBtn.className='user-chip user-chip-add';
  addBtn.textContent='＋ ついか';
  addBtn.addEventListener('click', ()=>{
    const name=promptNewUserName();
    if(name){ addUser(name); onUserChanged(); }
  });
  bar.appendChild(addBtn);
}

function onUserChanged(){
  renderUserBar();
  state.topicIdx=0;
  state.setIndex=1;
  renderTopics();
  renderCatBar();
  startNewSet();
}

function buildChoices(problem){
  answerRowEl.innerHTML='';
  const correctText=formatCorrectAnswer(problem);
  const distractorTexts=getDistractorValueSets(problem).map(vs=>formatChoiceFromValueSet(problem, vs));
  const shuffled=shuffle([correctText, ...distractorTexts]);
  state.correctChoiceText=correctText;
  state.selectedChoiceText=null;
  mainBtn.disabled=true;
  shuffled.forEach((text)=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='choice-btn';
    btn.innerHTML=text;
    btn.addEventListener('click', ()=>{
      if(state.answered) return;
      state.selectedChoiceText=text;
      mainBtn.disabled=false;
      answerRowEl.querySelectorAll('.choice-btn').forEach(b=>b.classList.toggle('selected', b===btn));
    });
    answerRowEl.appendChild(btn);
  });
}

/* ---------- フリーハンドの計算メモ ---------- */
const scratchCanvas=document.getElementById('scratchPad');
const scratchCtx=scratchCanvas.getContext('2d');
let scratchDrawing=false, scratchLast=null;
function setupScratchCanvas(){
  const rect=scratchCanvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio || 1;
  scratchCanvas.width=Math.round(rect.width*dpr);
  scratchCanvas.height=Math.round(rect.height*dpr);
  scratchCtx.setTransform(dpr,0,0,dpr,0,0);
  scratchCtx.lineCap='round';
  scratchCtx.lineJoin='round';
  scratchCtx.lineWidth=2.4;
  scratchCtx.strokeStyle='#233127';
}
function clearScratch(){
  scratchCtx.clearRect(0,0,scratchCanvas.width,scratchCanvas.height);
}
function scratchPointFromEvent(e){
  const rect=scratchCanvas.getBoundingClientRect();
  return { x:e.clientX-rect.left, y:e.clientY-rect.top };
}
scratchCanvas.addEventListener('pointerdown', (e)=>{
  scratchDrawing=true;
  scratchCanvas.setPointerCapture(e.pointerId);
  scratchLast=scratchPointFromEvent(e);
});
scratchCanvas.addEventListener('pointermove', (e)=>{
  if(!scratchDrawing) return;
  const p=scratchPointFromEvent(e);
  scratchCtx.beginPath();
  scratchCtx.moveTo(scratchLast.x, scratchLast.y);
  scratchCtx.lineTo(p.x, p.y);
  scratchCtx.stroke();
  scratchLast=p;
});
function stopScratchDrawing(){ scratchDrawing=false; scratchLast=null; }
scratchCanvas.addEventListener('pointerup', stopScratchDrawing);
scratchCanvas.addEventListener('pointerleave', stopScratchDrawing);
scratchCanvas.addEventListener('pointercancel', stopScratchDrawing);
document.getElementById('scratchClearBtn').addEventListener('click', clearScratch);
window.addEventListener('resize', setupScratchCanvas);

function renderProblem(problem){
  diagramEl.innerHTML='';
  questionEl.innerHTML='';
  if(problem.kind==='vertical'){
    const width=Math.max(String(problem.a).length, String(problem.b).length)+1;
    questionEl.innerHTML = `
      <div class="hissan">
        <div class="row"><span class="op"></span><span class="val">${problem.a}</span></div>
        <div class="row"><span class="op">${problem.op}</span><span class="val">${problem.b}</span></div>
        <hr>
      </div>`;
  }else if(problem.kind==='angle'){
    diagramEl.innerHTML = angleDiagram(problem.theta);
    questionEl.textContent = problem.text;
  }else if(problem.kind==='shape'){
    if(problem.shapeType==='triangle') diagramEl.innerHTML = triangleDiagram(problem.base, problem.height);
    else if(problem.shapeType==='parallelogram') diagramEl.innerHTML = parallelogramDiagram(problem.base, problem.height);
    else if(problem.shapeType==='circle') diagramEl.innerHTML = circleDiagram(problem.radius);
    questionEl.textContent = problem.text;
  }else if(problem.kind==='fracExpr'){
    questionEl.innerHTML = `${fracHTMLRaw(problem.n1,problem.d1)}<span class="frac-op">${problem.op}</span>${fracHTMLRaw(problem.n2,problem.d2)}<span class="frac-op">=</span>`;
  }else{
    questionEl.textContent = problem.plainText || problem.text;
  }
  buildChoices(problem);
}

function formatCorrectAnswer(problem){
  return formatChoiceFromValueSet(problem, correctValueSet(problem));
}

function checkAnswer(){
  return state.selectedChoiceText!==null && state.selectedChoiceText===state.correctChoiceText;
}

function startNewSet(){
  state.questionInSet=0;
  state.setCorrectCount=0;
  document.getElementById('setResult').classList.add('hidden');
  document.getElementById('quizPlay').classList.remove('hidden');
  nextQuestion();
}

function nextQuestion(){
  state.questionInSet++;
  const t=TOPICS[state.grade][state.topicIdx];
  state.current = t.gen();
  state.answered=false;
  renderProblem(state.current);
  clearScratch();
  feedbackEl.className='feedback';
  feedbackEl.innerHTML='';
  mainBtn.textContent='こたえあわせ';
  mainBtn.className='btn';
  renderRecord();
  updateTopBar();
  window.scrollTo({top:0, behavior:'smooth'});
}

function updateTopBar(){
  const profile=getCurrentProfile();
  progressTextEl.textContent = `セット${state.setIndex}・${state.questionInSet}/${QUESTIONS_PER_SET}問`;
  streakTextEl.textContent = `🔥 ${profile.streak}連続`;
}

function showSetResult(){
  document.getElementById('quizPlay').classList.add('hidden');
  const correct=state.setCorrectCount;
  document.getElementById('setResultEmoji').textContent =
    correct===QUESTIONS_PER_SET? '🏆' : correct>=7? '🎉' : correct>=4? '👍' : '💪';
  document.getElementById('setResultTitle').textContent = `セット${state.setIndex} クリア！`;
  document.getElementById('setResultScore').textContent =
    `${QUESTIONS_PER_SET}問中 ${correct}問正解（${correct*POINTS_PER_QUESTION}点）`;
  const nextIdx = state.setIndex % SETS_PER_CYCLE + 1;
  document.getElementById('nextSetBtn').textContent = `つぎのセット(${nextIdx})へ`;
  document.getElementById('setResult').classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('nextSetBtn').addEventListener('click', ()=>{
  state.setIndex = state.setIndex % SETS_PER_CYCLE + 1;
  startNewSet();
});

mainBtn.addEventListener('click', ()=>{
  if(!state.answered){
    const problem=state.current;
    const ok=checkAnswer();
    state.answered=true;
    const profile=getCurrentProfile();
    const beforePoints=profile.totalPoints;
    profile.todayAttempted++;
    if(ok){
      profile.todayCorrect++;
      profile.streak++;
      profile.totalPoints+=POINTS_PER_QUESTION;
      state.setCorrectCount++;
    }else{
      profile.streak=0;
    }
    const t=TOPICS[state.grade][state.topicIdx];
    recordResult(state.grade, t.id, ok);
    feedbackEl.className='feedback show '+(ok?'good':'bad');
    if(ok){
      feedbackEl.innerHTML = '<b>◯ せいかい！</b>';
      checkCatMilestones(beforePoints, profile.totalPoints);
    }else{
      feedbackEl.innerHTML = `<b>✕ おしい！</b><br>正しい答え：${formatCorrectAnswer(problem)}`;
    }
    mainBtn.textContent = state.questionInSet>=QUESTIONS_PER_SET? 'けっかをみる' : 'つぎのもんだい';
    updateTopBar();
    renderRecord();
    renderCatBar();
  }else if(state.questionInSet>=QUESTIONS_PER_SET){
    showSetResult();
  }else{
    nextQuestion();
  }
});

document.getElementById('catBookBtn').addEventListener('click', ()=>{
  renderCatBook();
  document.getElementById('catOverlay').classList.remove('hidden');
});
document.getElementById('catCloseBtn').addEventListener('click', ()=>{
  document.getElementById('catOverlay').classList.add('hidden');
});
document.getElementById('catOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='catOverlay') e.currentTarget.classList.add('hidden');
});

/* ---------- init ---------- */
(function init(){
  loadProfiles();
  if(profilesState.users.length===0){
    addUser('プレイヤー1');
  }
  setupScratchCanvas();
  renderUserBar();
  setAccent(state.grade);
  renderTabs();
  renderTopics();
  renderCatBar();
  startNewSet();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
